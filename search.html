<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search | To Dye For and More</title>
  <meta name="description" content="Search custom apparel, hand-painted shoes, gifts, and team &amp; bulk orders from To Dye For and More.">
  <!-- Search results aren't useful in Google, so keep this page out of search engines -->
  <meta name="robots" content="noindex, follow">
  <!-- LINK PREVIEWS: what shows when this page is shared by text or on social media.
       Once the site has its own web address, change the image to the full address,
       e.g. https://www.yourdomain.com/assets/photos/og-preview.jpg -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="To Dye For and More">
  <meta property="og:title" content="Search | To Dye For and More">
  <meta property="og:description" content="Search custom apparel, hand-painted shoes, gifts, and team &amp; bulk orders.">
  <meta property="og:image" content="assets/photos/og-preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <!-- Browser tab icon: the small "tdf" logo -->
  <link rel="icon" href="assets/photos/tdf-favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/photos/tdf-apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- HEADER + NAV: built by assets/js/layout.js. Logo file: config.js → logo.src -->
  <header id="site-header"></header>

  <main id="main">
    <!-- ============================================================
         SEARCH RESULTS
         Filled in by assets/js/search.js from the web address,
         e.g. search.html?q=red+wings. Results use the same tiles
         and buttons as the Shop page.
         ============================================================ -->
    <div data-search-page>
      <section class="search-hero">
        <div class="container">
          <h1 data-search-heading aria-live="polite">Search</h1>
          <div data-search-form></div>
        </div>
      </section>

      <section class="section search-results">
        <div class="container">
          <div class="grid grid--4 product-grid" data-search-grid></div>
          <div data-search-empty></div>
        </div>
      </section>
    </div>
  </main>

  <!-- FOOTER: built by assets/js/layout.js -->
  <footer id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/seo.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/shop.js"></script>
  <script src="assets/js/search.js"></script>
  <script src="assets/js/slideshow.js"></script>
</body>
</html>
